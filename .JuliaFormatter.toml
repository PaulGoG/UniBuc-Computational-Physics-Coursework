# Formatting rules for the whole archive. SciMLStyle rather than the default:
# the default splits any call wider than the margin to one argument per line,
# which turns `text!(ax, 0.5, 0.9; text = ..., align = ...)` into six lines and
# `set_theme!(Theme(...))` into twenty, and reads far worse than what these
# scripts were written as. SciMLStyle is built for hand-written scientific
# Julia and keeps such calls together.
#
#   julia -e 'include("activate.jl"); using JuliaFormatter; format(".")'

style = "sciml"
indent = 4
margin = 92

# `f(x; color = :blue)` and `x[i + 1]`, as the scripts already write them.
whitespace_in_kwargs = true
whitespace_ops_in_indices = true

# `for i in 1:n`, never `for i = 1:n`.
always_for_in = true

# Keep the comma on the last entry of a multi-line call or tuple, so that adding
# an entry later touches one line rather than two.
trailing_comma = true

# Left alone deliberately: the docstrings are written to be read as prose and
# reflowing them to the margin breaks the equations and tables inside them;
# `x::Int` keeps its tight colons; and one-line definitions such as
# `Z_p(A_H) = Z₀ * A_H / A₀ + ΔZ` stay one-liners.
format_docstrings = false
whitespace_typedefs = false
short_to_long_function_def = false

# The scripts are not a package: `using X` versus `import X` is not something to
# rewrite, and a bare `return` is not always wanted.
import_to_using = false
always_use_return = false
