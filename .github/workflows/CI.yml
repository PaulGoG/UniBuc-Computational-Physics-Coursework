name: CI

# A script archive: nothing to test or register. This workflow checks that the
# environment still resolves within its [compat] bounds and renders a figure on
# a clean machine; Format.yml checks the formatting.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The archive is complete, so commits are rare; a monthly run catches an
  # environment that has stopped resolving or rendering between them.
  schedule:
    - cron: '41 5 1 * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Environment and rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      # One script end to end, invoked as in the README: it activates and
      # instantiates the environment itself, loads the shared theme and writes
      # a PNG, without needing any of the data files.
      - name: Render a figure
        run: julia bsc/08-numerical-methods-ii/linear_program.jl
      - name: Confirm the figure was written
        shell: julia --color=yes {0}
        run: |
          path = joinpath("bsc", "08-numerical-methods-ii", "figures", "linear_program.png")
          isfile(path) || (@error "$path was not written"; exit(1))
          @info "wrote $path, $(filesize(path)) bytes"
