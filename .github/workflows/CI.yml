name: CI

# Trimmed to what a script archive warrants. There is no package to test, no
# docs to build and nothing to register, so the two things worth checking are
# that the formatting matches the committed configuration and that the pinned
# environment still resolves and renders a figure on a machine that is not this
# one — which is the whole claim the Manifest is committed to support.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Check against .JuliaFormatter.toml
        shell: julia --project=. --color=yes {0}
        run: |
          using Pkg
          Pkg.instantiate()
          using JuliaFormatter
          if !format("."; overwrite = false)
              @error """
              Formatting differs from .JuliaFormatter.toml. Run

                  julia --project=. -e 'using JuliaFormatter; format(".")'

              and commit the result.
              """
              exit(1)
          end

  render:
    name: Environment and rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Instantiate the pinned environment
        run: julia activate.jl
      # One script end to end: it resolves the environment, loads the shared
      # theme and writes a PNG, without needing any of the data files. If this
      # passes, a figure is reproducible off this machine.
      - name: Render a figure
        run: julia --project=. bsc/08-numerical-methods-ii/linear_program.jl
      - name: Confirm the figure was written
        shell: julia --color=yes {0}
        run: |
          path = joinpath("bsc", "08-numerical-methods-ii", "figures", "linear_program.png")
          isfile(path) || (@error "$path was not written"; exit(1))
          @info "wrote $path, $(filesize(path)) bytes"
