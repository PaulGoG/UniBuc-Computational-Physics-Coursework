name: CI

# Trimmed to what a script archive warrants. There is no package to test, no
# docs to build and nothing to register, so the two things worth checking are
# that the formatting matches the committed configuration and that the
# environment still resolves within its [compat] bounds and renders a figure on
# a machine that is not this one.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Check against .JuliaFormatter.toml
        shell: julia --color=yes {0}
        run: |
          include("activate.jl")
          using JuliaFormatter
          if !format("."; overwrite = false)
              @error """
              Formatting differs from .JuliaFormatter.toml. Run

                  julia -e 'include("activate.jl"); using JuliaFormatter; format(".")'

              and commit the result.
              """
              exit(1)
          end

  render:
    name: Environment and rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      # One script end to end, invoked as the README says: it activates and
      # instantiates the environment itself, loads the shared theme and writes
      # a PNG, without needing any of the data files. If this passes, a figure
      # is reproducible off this machine.
      - name: Render a figure
        run: julia bsc/08-numerical-methods-ii/linear_program.jl
      - name: Confirm the figure was written
        shell: julia --color=yes {0}
        run: |
          path = joinpath("bsc", "08-numerical-methods-ii", "figures", "linear_program.png")
          isfile(path) || (@error "$path was not written"; exit(1))
          @info "wrote $path, $(filesize(path)) bytes"
